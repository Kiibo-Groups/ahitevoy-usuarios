<ion-header>
  <ion-toolbar color="white">
  <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title *ngIf="text">{{text.city_title}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content padding="true" *ngIf="text">

<ion-searchbar (ionInput)="search($event)" mode="ios" color="light" placeholder="{{ text.city_search }}"></ion-searchbar>

<ion-list>
<ion-radio-group>
<ion-list-header>
<ion-label>{{text.city_heading}}</ion-label>
</ion-list-header>

<ion-item *ngFor="let city of data">
<ion-label>{{ city.name }}</ion-label>
<ion-radio slot="start" color="primary" value="{{ city.id }}" (ionSelect)="setCity(city.id,city.name)" ></ion-radio>

</ion-item>
</ion-radio-group>
</ion-list>
<br>
<ion-button expand="block" size="large" type="button" [disabled]="!cityID" (click)="city()" mode="ios" color="primary">{{text.city_button}}</ion-button>

</ion-content>

<ion-header mode="ios">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button text="" icon="chevron-back-outline"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen mode="ios">

  <!-- Decoración de fondo sutil (Círculo difuminado) -->
  <div class="bg-decoration"></div>

  <div class="wrap-content">
    
    <!-- BANNER Y LOGO -->
    <div class="banner animate__animated animate__fadeInDown">
      <div class="logo">
        <img src="assets/top_pic.png" alt="AhiTeVoy Logo">
      </div>
    </div>

    <!-- FORMULARIO -->
    <div class="form animate__animated animate__fadeInUp">
      <div class="title-text">¡Bienvenido de nuevo!</div>
      <div class="subtitle-text">Ingresa tu correo y contraseña para acceder a tu cuenta.</div>

      <ion-list lines="none">
        
        <!-- Input Email -->
        <ion-item>
          <div class="item_inner">
            <h3><ion-icon name="mail-outline"></ion-icon></h3>
            <ion-input 
              mode="md" 
              #email 
              clearInput 
              minlength="5" 
              name="email" 
              type="email"
              placeholder="correo@ejemplo.com">
            </ion-input>
          </div>
        </ion-item>

        <!-- Input Password -->
        <ion-item>
          <div class="item_inner">
            <h3><ion-icon name="lock-closed-outline"></ion-icon></h3>
            <ion-input 
              mode="md" 
              #password 
              clearInput 
              minlength="5" 
              name="password" 
              type="password"
              placeholder="••••••••••••">
            </ion-input>
          </div>
        </ion-item>

        <!-- Olvidaste tu contraseña -->
        <ion-item class="pc_text forgot-pass">
          <ion-label (click)="forgotPass()">
            ¿No recuerdas tu contraseña? <a href="javascript:void(0)">Recupérala aquí</a>
          </ion-label>
        </ion-item>

        <!-- Términos y condiciones -->
        <ion-item class="pc_text terms">
          <ion-checkbox slot="start" [(ngModel)]="isCheckedPC" mode="md"></ion-checkbox>
          <ion-label>
            Acepto los <a href="javascript:void(0)">Términos y Condiciones</a> y el <a href="javascript:void(0)">Aviso de Privacidad</a>
          </ion-label>
        </ion-item>

      </ion-list>
    </div>

    <!-- Recaptcha -->
    <div class="recaptcha-wrapper">
      <div id="recaptcha-container"></div>
    </div>

    <!-- BOTONES DE ACCIÓN (Ahora dentro de ion-content para scroll natural) -->
    <div class="actions-section animate__animated animate__fadeInUp">
      <!-- Botón Principal: Continuar -->
      <ion-button class="btn_next" expand="block" (click)="newLogin()" mode="ios">
        Continuar
        <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
      </ion-button>

      <!-- Botón Invitado -->
      <ion-button class="btn_guest" expand="block" fill="outline" (click)="guestUser()" mode="ios">
        <ion-icon name="person-outline"></ion-icon>
        Ingresar como invitado
      </ion-button>
      
      <div class="register-text" routerLink="/signup" routerDirection="forward">
        ¿No tienes una cuenta? <b>Regístrate</b>
      </div>
    </div>

  </div>
</ion-content>
